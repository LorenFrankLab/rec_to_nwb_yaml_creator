# A legacy, NON-CONFORMING metadata YAML for the Import & Repair flow.
#
# Derived from golden/workspace-export.realistic.yml (a clean, decompose-ok merge output) by
# corrupting EXACTLY the fields the repair screen must surface, so that — once every suggested
# fix is accepted and every required input filled — the model validates clean and commits:
#
#   subject.species       "Rat"            free text          -> invalid_species (rule)        -> suggest "Rattus norvegicus"
#   subject.sex           "Male"           not the M/F/U/O set -> enum (schema)                  -> suggest "M"
#   subject.weight        "485g"           a string, not a num -> type (schema)                  -> suggest 485
#   subject.date_of_birth (absent)         required, missing   -> required (schema)              -> BLOCKS (user supplies)
#   electrode_groups[0].location  null     empty location      -> empty_location (rule)          -> user supplies a region
#   experimenter_name     "Guidera, Jennifer"  a scalar, not a list -> type (schema)             -> suggest ["Guidera, Jennifer"]
#
# session_id carries the recording date (remy_20230622 -> 2023-06-22) so the commit can attribute it.
