name: Test Suite

on:
  push:
    branches: [main, modern]  # main + the active development branch
  pull_request:
    branches: [main, modern]  # PRs targeting main or modern

permissions:
  contents: read
  pull-requests: write

jobs:
  # Fast, deterministic correctness gate — runs WITHOUT coverage instrumentation.
  # Coverage's v8 instrumentation roughly triples per-test wall-clock (measured:
  # heavy App-render integration tests go ~3s -> ~10s under coverage), which on the
  # 4-core CI runner stacks with CPU oversubscription and nondeterministically pushes
  # whichever heavy test gets starved past its timeout. Keeping coverage off this gate
  # makes it fast (heavy tests ~3s, large margin) and the failing-test set stable.
  # The slow coverage run lives in the separate `coverage` job below so it never flaps
  # this gate or the e2e/integration/build jobs that depend on it.
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check schema version
        run: node scripts/check-schema-version.mjs --expected-version 1.0.1

      - name: Run linter (warnings-as-errors gate)
        # `lint:ci` runs ESLint with --max-warnings 0. This is the warnings-as-errors gate that
        # CRA's `CI=true react-scripts build` used to provide; the Vite build does not run ESLint,
        # so the strictness lives here instead. Scope is the whole repo (stricter than CRA, which
        # only linted the build graph).
        run: npm run lint:ci

      - name: Run CSS linter (stylelint)
        # Warn-level for now (defaultSeverity is "warning"): this runs and reports token /
        # style debt without failing the gate. Phase 9 ratchets stylelint to error-level when
        # the build gate is re-armed.
        run: npm run lint:css

      - name: Run all tests (no coverage)
        run: npm test -- run

  # Static TypeScript gate. Runs in parallel (no `needs:`) and is fast: the Babel
  # build does NOT type-check, so `tsc --noEmit` is the only thing that does. It
  # type-checks the migrated `.ts`/`.tsx` files (checkJs is off, so `.js` is parsed
  # but not type-checked) and grows as more modules are converted.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

  # Coverage + threshold enforcement, isolated from the correctness gate. Runs in
  # parallel (no `needs:`) so coverage feedback is not delayed. The `test:coverage`
  # script raises testTimeout to 120s to size the per-test budget to coverage's cost
  # on the constrained 4-core runner — v8 instrumentation ~triples per-test wall-clock
  # and slow cores + oversubscription pushed the heaviest test past 60s (see package.json).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests with coverage
        run: npm run test:coverage -- run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

  integration:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: rec_to_nwb_yaml_creator

      - name: Checkout trodes_to_nwb repository
        uses: actions/checkout@v4
        with:
          repository: LorenFrankLab/trodes_to_nwb
          ref: main
          path: trodes_to_nwb

      - name: Compare nwb_schema.json (ignoring app-only version field)
        run: |
          WEBAPP_SCHEMA="rec_to_nwb_yaml_creator/src/nwb_schema.json"
          PYTHON_SCHEMA="trodes_to_nwb/src/trodes_to_nwb/nwb_schema.json"

          if [ ! -f "$PYTHON_SCHEMA" ]; then
            echo "❌ trodes_to_nwb schema file not found at expected location:"
            echo "   $PYTHON_SCHEMA"
            echo ""
            echo "The schema-sync gate cannot compare schemas. The checkout path or upstream"
            echo "schema location may have changed; update this workflow before merging."
            echo "Expected upstream file:"
            echo "https://github.com/LorenFrankLab/trodes_to_nwb/blob/main/src/trodes_to_nwb/nwb_schema.json"
            exit 1
          fi

          # The web app stamps a top-level `version` field on its schema for its own
          # version-drift tooling (scripts/check-schema-version.mjs, run in the `test`
          # gate); trodes_to_nwb's copy does not carry that field. Both behaviours are
          # intentional, so a raw byte comparison is mutually unsatisfiable. Compare the
          # SUBSTANTIVE schema instead: strip the app-only `version` key from both and
          # canonicalize (sorted keys) before hashing. Any real drift in
          # properties/required/types/definitions still fails the gate.
          WEBAPP_HASH=$(jq -S 'del(.version)' "$WEBAPP_SCHEMA" | sha256sum | cut -d' ' -f1)
          PYTHON_HASH=$(jq -S 'del(.version)' "$PYTHON_SCHEMA" | sha256sum | cut -d' ' -f1)
          echo "Web app schema hash (sans version):    $WEBAPP_HASH"
          echo "Python pkg schema hash (sans version): $PYTHON_HASH (main branch)"

          if [ "$WEBAPP_HASH" != "$PYTHON_HASH" ]; then
            echo "❌ Schema mismatch detected (beyond the app-only version field)!"
            echo ""
            echo "The substantive nwb_schema.json content is out of sync between repositories."
            echo "Diff (web app vs trodes_to_nwb main, version field ignored):"
            diff <(jq -S 'del(.version)' "$WEBAPP_SCHEMA") <(jq -S 'del(.version)' "$PYTHON_SCHEMA") || true
            echo ""
            echo "Please ensure the web app schema matches:"
            echo "https://github.com/LorenFrankLab/trodes_to_nwb/blob/main/src/trodes_to_nwb/nwb_schema.json"
            exit 1
          fi

          echo "✅ Schemas are synchronized (ignoring the app-only version field)"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # `npm run build` is now `vite build` (was `react-scripts build`). Vite does NOT run ESLint
        # during the build, so the warnings-as-errors gate moved to the `lint:ci` step in the test
        # job (eslint --max-warnings 0). This step verifies the production bundle compiles.
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7
