name: Test Suite

on:
  push:
    branches: [main, modern]  # main + the active development branch
  pull_request:
    branches: [main, modern]  # PRs targeting main or modern

permissions:
  contents: read
  pull-requests: write

jobs:
  # Fast, deterministic correctness gate — runs WITHOUT coverage instrumentation.
  # Coverage's v8 instrumentation roughly triples per-test wall-clock (measured:
  # heavy App-render integration tests go ~3s -> ~10s under coverage), which on the
  # 4-core CI runner stacks with CPU oversubscription and nondeterministically pushes
  # whichever heavy test gets starved past its timeout. Keeping coverage off this gate
  # makes it fast (heavy tests ~3s, large margin) and the failing-test set stable.
  # The slow coverage run lives in the separate `coverage` job below so it never flaps
  # this gate or the e2e/integration/build jobs that depend on it.
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check schema version
        run: node scripts/check-schema-version.mjs --expected-version 1.0.1

      - name: Run linter
        run: npm run lint

      - name: Run all tests (no coverage)
        run: npm test -- run

  # Coverage + threshold enforcement, isolated from the correctness gate. Runs in
  # parallel (no `needs:`) so coverage feedback is not delayed. The `test:coverage`
  # script raises testTimeout to 60s to size the per-test budget to coverage's ~3x
  # instrumentation cost on the constrained runner (see package.json).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests with coverage
        run: npm run test:coverage -- run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

  integration:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: rec_to_nwb_yaml_creator

      - name: Checkout trodes_to_nwb repository
        uses: actions/checkout@v4
        with:
          repository: LorenFrankLab/trodes_to_nwb
          ref: main
          path: trodes_to_nwb

      - name: Compare nwb_schema.json
        run: |
          cd rec_to_nwb_yaml_creator
          SCHEMA_HASH=$(sha256sum src/nwb_schema.json | cut -d' ' -f1)
          echo "Web app schema hash: $SCHEMA_HASH"

          cd ../trodes_to_nwb
          if [ -f "src/trodes_to_nwb/nwb_schema.json" ]; then
            PYTHON_SCHEMA_HASH=$(sha256sum src/trodes_to_nwb/nwb_schema.json | cut -d' ' -f1)
            echo "Python package schema hash: $PYTHON_SCHEMA_HASH"

            if [ "$SCHEMA_HASH" != "$PYTHON_SCHEMA_HASH" ]; then
              echo "❌ Schema mismatch detected!"
              echo "Web app hash:    $SCHEMA_HASH"
              echo "Python pkg hash: $PYTHON_SCHEMA_HASH (main branch)"
              echo ""
              echo "The nwb_schema.json files are out of sync between repositories."
              echo "Please ensure the web app schema matches:"
              echo "https://github.com/LorenFrankLab/trodes_to_nwb/blob/main/src/trodes_to_nwb/nwb_schema.json"
              exit 1
            fi

            echo "✅ Schemas are synchronized"
          else
            echo "⚠️ Warning: trodes_to_nwb schema file not found at expected location"
            echo "Skipping schema sync check"
          fi

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # CI=false is intentional and required: Create React App treats ESLint
        # warnings as build errors when CI=true. The build currently surfaces ~79
        # warnings across ~36 files (mostly missing-JSDoc-type rules, a few
        # unused-vars and react-hooks/exhaustive-deps). Clearing them is deferred
        # to a dedicated lint-cleanup pass (some live in src/state/store.js, which
        # is slated for a separate refactor). Do NOT drop CI=false until the
        # warning count is zero; do NOT suppress the rules globally. Tracked as
        # known build debt.
        run: CI=false npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7
